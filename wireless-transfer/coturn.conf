# 无线传输 - Coturn TURN 中继配置（跨互联网传输用，HTTP 部署下必备）
# 仅当设备间无法 P2P 直连（对称 NAT / 跨网）时才需要。

# 监听端口：高位端口（运营商封 80/443，且只能用高位端口）
listening-port=34780
# 纯 HTTP 部署不需要 TLS TURN，注释掉避免无证书报错
# tls-listening-port=53490

# 长期凭证机制（与 app 的 TURN_USERNAME / TURN_CREDENTIAL 对应）
lt-cred-mech
user=wireless:CHANGE_THIS_TO_A_STRONG_PASSWORD

# 中继端口范围（公网防火墙需放行该 UDP 范围）
min-port=40000
max-port=40010

# 公网 IP 不再写死：docker-compose 中 coturn 已设 DETECT_EXTERNAL_IP=yes，
# 容器启动时自动向公共 DNS 解析自身公网 IP 并通告对端；动态 IP 变动后重启容器即可。
# external-ip=YOUR_PUBLIC_IP

realm=wireless.local

# 日志
verbose
