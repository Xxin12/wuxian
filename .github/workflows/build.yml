name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要 packages:write 才能推送 GHCR
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub Container Registry（ghcr.io），直接用 Actions 自带的 GITHUB_TOKEN，无需 Docker Hub 密钥
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # 注意：Dockerfile 在仓库的 wireless-transfer/ 子目录，构建上下文必须指向它
          context: ./wireless-transfer
          # 同时构建 amd64 与 arm64，覆盖大多数威联通 NAS（x86 与部分 ARM 机型）
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wireless-transfer:latest
